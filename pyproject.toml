[build-system]
requires = ["setuptools >= 80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus-lib"
version = "0.0.0"
readme = "README.md"
authors = [
    {name="Malakai Spann", email="MalakaiSpann@gmail.com"}
]

description = "A collection of useful Python Classes, Methods, and Constants"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]

[project.urls]
Repository = "https://github.com/malakaispann/hephaestus/"

[tool.setuptools.packages.find]
where = ["."]
include = ["hephaestus.*"]
exclude = ["tests", "*.__pycache__*"]
namespaces = true 

[tool.black]
extend-exclude = '^.*\.(md|txt)'

[tool.pylint]
rcfile = "pylintrc"


[tool.pytest.ini_options]
addopts = "-rpfs --quiet --show-capture=no --random-order-bucket=class --color=no"
testpaths = [
    "tests"
]

[dependency-groups]
dev = [
	{include-group = "format"},
  	{include-group = "test"}
]
format = [
    "black>=25.11.0",
    "pylint>=4.0.4",
]
test = [
    "pytest>=9.0.1",
    "pytest-random-order>=1.2.0",
]

