[project]
name = "hephaestus-lib"
version = "0.0.0"
readme = "README.md"
authors = [
    {name="Malakai Spann", email="MalakaiSpann@gmail.com"}
]

description = "A collection of useful Python Classes, Methods, and Constants"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]

[project.urls]
Repository = "https://github.com/malakaispann/hephaestus/"


[dependency-groups]
dev = [
	{include-group = "format"},
  	{include-group = "test"}
]
format = [
    "black>=25.11.0",
    "pylint>=3.3.9",
]
test = [
    "pytest>=8.4.2",
    "pytest-random-order>=1.2.0",
]


[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-rpfs --quiet --show-capture=no --random-order-bucket=class --color=no"
testpaths = [
    "src/tests"
]
pythonpath = [
    "src"
]

[tool.uv.build-backend]
module-name = "hephaestus"
module-root = "src"


